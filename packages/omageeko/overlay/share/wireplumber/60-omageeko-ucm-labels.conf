# omageeko: readable names for laptop codec devices exposed through ALSA UCM.
# PipeWire otherwise takes node.nick from the codec's PCM name ("ALC257 Analog")
# for both the headphone jack and the headset mic, and Omarchy's audio panel
# labels rows by node.nick. UCM HiFi node names are standard across HDA/SOF laptops.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.pci-.*\\.HiFi__Headphones__sink" } ]
    actions = { update-props = { node.nick = "Headphones (jack)", node.description = "Laptop headphone jack" } }
  }
  {
    matches = [ { node.name = "~alsa_output.pci-.*\\.HiFi__Speaker__sink" } ]
    actions = { update-props = { node.nick = "Laptop speakers", node.description = "Laptop speakers" } }
  }
  {
    matches = [ { node.name = "~alsa_input.pci-.*\\.HiFi__Mic2__source" } ]
    actions = { update-props = { node.nick = "Headset mic (jack)", node.description = "Headset microphone (jack)" } }
  }
  {
    matches = [ { node.name = "~alsa_input.pci-.*\\.HiFi__Mic1__source" } ]
    actions = { update-props = { node.nick = "Laptop microphone", node.description = "Laptop microphone array" } }
  }
]
