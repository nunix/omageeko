# omageeko: Omarchy's kernel enables the multi-gen LRU at build time
# (CONFIG_LRU_GEN_ENABLED=y, all components: 0x0007); Tumbleweed builds it in
# but leaves it off. MGLRU picks reclaim victims by access generation instead
# of the two active/inactive lists, which keeps the working set resident under
# pressure. Boot-only (w!), so toggling it by hand for a comparison sticks
# until reboot.
w! /sys/kernel/mm/lru_gen/enabled - - - - y
