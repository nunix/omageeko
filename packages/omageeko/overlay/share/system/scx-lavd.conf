# omageeko: Omarchy's kernel replaces the fair-class scheduler with BORE, a
# patch Tumbleweed doesn't carry. Its stock kernel has sched_ext instead, and
# scx_lavd (latency-criticality aware virtual deadline, from the scx package)
# aims at the same thing: keep interactive tasks responsive while the CPU is
# saturated. --autopower follows power-profiles-daemon, so Performance and
# Power Saver also switch the scheduler's own power mode.
#
# The override variables leave /etc/default/scx (the package's config file)
# untouched; set SCX_SCHEDULER_OVERRIDE in a later drop-in to try another one.
# If the BPF scheduler exits or fails, the kernel falls back to the fair class.
[Service]
Environment=SCX_SCHEDULER_OVERRIDE=scx_lavd
Environment=SCX_FLAGS_OVERRIDE=--autopower
